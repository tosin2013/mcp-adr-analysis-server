name: Test MCP Server

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          # Install build tools for native compilation
          sudo apt-get update -qq
          sudo apt-get install -y build-essential python3

          # Try make install first
          if ! make install; then
            echo "❌ Make install failed, trying npm install..."
            npm install
          fi

          # Rebuild native bindings for tree-sitter with proper error handling
          echo "🔨 Rebuilding tree-sitter native bindings..."
          if ! npm rebuild tree-sitter; then
            echo "⚠️ Tree-sitter rebuild failed, but continuing (tests handle graceful fallback)"
          fi

      - name: Test Node.js compatibility
        run: |
          make node-compat
          echo "Testing server health check..."
          node dist/src/index.js --test

      - name: Run unit tests
        # test-ci omits the npm audit prerequisite on purpose — the audit runs in
        # the security-scan job. See Makefile.
        run: make test-ci

      # MUST run before "Build the project". `npm run build` triggers `prebuild`,
      # which is `npm run clean` -- `rm -rf dist coverage`. With the upload step
      # at the end of the job, the build deleted coverage/ before Codecov ever
      # looked for it:
      #   Some files were not found --- {"not_found_files": ["coverage/lcov.info"]}
      # That was latent for as long as lcov.info was never generated at all;
      # generating it and setting fail_ci_if_error: true is what surfaced it.
      - name: Upload coverage reports
        if: matrix.node-version == '20'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          # Required: tokenless upload is refused on a protected branch --
          #   {"message":"Token required because branch is protected"}
          # Set it once with:  gh secret set CODECOV_TOKEN
          # (value from codecov.io -> this repo -> Settings)
          token: ${{ secrets.CODECOV_TOKEN }}
          # Without an explicit slug the upload was rejected with
          #   {"message":"Repository not found"}
          # even with a valid 36-char token. Codecov's own setup snippet passes
          # it, and on a fork-aware CI it cannot always infer the owner/repo.
          slug: tosin2013/mcp-adr-analysis-server
          # Was false while lcov.info was never generated, so a silently missing
          # report looked like a healthy upload.
          fail_ci_if_error: true

      - name: Build the project
        run: npm run build

      # Packs the tarball, installs it somewhere with no node_modules of its own,
      # and imports the AI-path entry points. This is the ONLY check that can
      # catch a runtime dependency misfiled under devDependencies -- the bug that
      # shipped in 2.6.13 and broke every AI path for npm consumers (#1409).
      # `npm run health` cannot: startup never loads those modules.
      - name: Verify the packaged artifact resolves at runtime
        if: matrix.node-version == '20'
        run: bash scripts/verify-packaged-runtime.sh

      - name: Test MCP server health check
        run: |
          echo "Testing MCP server health check..."
          if npm run health; then
            echo "✅ MCP server health check passed"
          else
            echo "❌ MCP server health check failed"
            exit 1
          fi

      - name: Test MCP server functionality
        run: |
          echo "Testing MCP server functionality..."

          # Use our validation script to check build output
          if [ -f "scripts/validate-build.js" ]; then
            echo "Running comprehensive build validation..."
            node scripts/validate-build.js
          fi

          # Check that the built server contains expected MCP tools (basic validation)
          echo "Checking for MCP tool implementations..."

          # Check core tools
          if grep -q "analyze_project" dist/src/index.js; then
            echo "✅ analyze_project tool found"
          else
            echo "❌ analyze_project tool not found"
            exit 1
          fi

          # Check new planning tools
          if grep -q "mcp_planning" dist/src/index.js; then
            echo "✅ mcp_planning tool found"
          else
            echo "❌ mcp_planning tool not found"
            exit 1
          fi

          if grep -q "interactive_adr_planning" dist/src/index.js; then
            echo "✅ interactive_adr_planning tool found"
          else
            echo "❌ interactive_adr_planning tool not found"
            exit 1
          fi

          if grep -q "ListToolsRequestSchema" dist/src/index.js; then
            echo "✅ ListToolsRequestSchema handler found"
          else
            echo "❌ ListToolsRequestSchema handler not found"
            exit 1
          fi

          echo "✅ MCP server functionality validated"

      - name: Test MCP functionality with Inspector
        continue-on-error: true
        run: |
          echo "Running comprehensive MCP functionality tests..."

          # Install bc for floating point calculations in test script
          sudo apt-get install -y bc

          # Run MCP functionality tests using @modelcontextprotocol/inspector
          if npm run test:mcp; then
            echo "✅ MCP Inspector tests passed"
          else
            echo "❌ MCP Inspector tests failed"
            # Still allow pipeline to continue as these are integration tests
            echo "Note: MCP Inspector tests failed but pipeline continues"
          fi

          # Display test results if available
          if [ -f "mcp-test-results.json" ]; then
            echo "📊 MCP Test Results:"
            cat mcp-test-results.json | jq '.' || cat mcp-test-results.json
          fi

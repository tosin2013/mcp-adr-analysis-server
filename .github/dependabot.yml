version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
      time: '09:00'
      timezone: 'UTC'
    # Security updates get priority
    open-pull-requests-limit: 15
    # Separate MCP SDK updates for enhanced testing
    groups:
      # Critical MCP SDK updates - handled separately with enhanced testing
      mcp-sdk-updates:
        patterns:
          - '@modelcontextprotocol/sdk'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'
      # Other production dependencies
      production-dependencies:
        patterns:
          - '@types/*'
          - 'openai'
          - 'zod'
          - 'fast-glob'
          - 'tslib'
        update-types:
          - 'minor'
          - 'patch'
      # Development dependencies
      development-dependencies:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - 'typescript'
          - 'eslint*'
          - 'prettier*'
          - 'tsx'
        update-types:
          - 'minor'
          - 'patch'
    # Enhanced commit messages for better tracking
    commit-message:
      prefix: 'deps'
      prefix-development: 'deps-dev'
      include: 'scope'
    # Scheduled VERSION updates: direct dependencies only (production + dev).
    # Previously "all", which opened a daily PR for every transitive lockfile-only
    # bump (mdurl, flatted, electron-to-chromium, browserslist, @radix-ui/*) and
    # kept open-pull-requests-limit permanently saturated.
    #
    # This does NOT silence transitive advisories: Dependabot SECURITY updates are
    # driven by Dependabot alerts, not by this block, and cover the whole tree.
    # Both "Dependabot alerts" and "Dependabot security updates" must stay enabled
    # under Settings -> Code security. They were disabled until 2026-08-05, which is
    # why the hono / ip-address / fast-uri advisories that froze the PR queue before
    # v2.6.11 only ever surfaced as a side effect of unfiltered version updates.
    allow:
      - dependency-type: 'direct'
    # Add labels to make PRs easy to identify
    labels:
      - 'dependencies'
      - 'security'
    ignore:
      # ADR-017: tree-sitter ecosystem is pinned to 0.21.x because
      # tree-sitter-typescript (latest 0.23.2) still requires ^0.21.0.
      # Upgrading the core library breaks TypeScript and Java parsing.
      # Re-evaluate when tree-sitter-typescript releases a 0.25.x build.
      - dependency-name: 'tree-sitter'
        versions: ['>=0.22.0']
    # Add reviewers for critical dependencies
    reviewers:
      - 'tosin2013'
    # Custom PR titles to highlight security updates
    pull-request-branch-name:
      separator: '/'

  # Docs site (Docusaurus) — security updates only, not shipped in npm package
  - package-ecosystem: 'npm'
    directory: '/docs'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'UTC'
    allow:
      - dependency-type: 'direct'
    groups:
      # Keep the React packages on the same major. Dependabot had split react and
      # react-dom into separate PRs (#1620 / #1622); each fails `npm ci` on its own
      # because react-dom@19 peer-requires react@19. Grouping makes the bump atomic.
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'
    commit-message:
      prefix: 'deps(docs)'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'documentation'
    open-pull-requests-limit: 5

  # Also check GitHub Actions for security updates
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'UTC'
    commit-message:
      prefix: 'ci'
      include: 'scope'
    labels:
      - 'github-actions'
      - 'security'
    # The github/gh-aw-actions/* pins live inside .github/workflows/*.lock.yml,
    # which are COMPILED ARTIFACTS produced by the gh-aw compiler — not files
    # meant to be hand-edited. Dependabot rewrites the pinned SHA in place
    # without regenerating the rest of the lock file, which breaks the pairing
    # between the action and the runtime it expects.
    #
    # PR #1330 did exactly that (SHA ba90f21 -> b078ca2) and every agentic
    # workflow started failing at container startup:
    #
    #   [ERROR] Failed to start containers: docker compose up -d --pull never
    #   Error: Cannot find module '.../gh-aw/actions/detect_copilot_errors.cjs'
    #
    # The tell that it did not understand the file: it changed the SHA but left
    # the adjacent `# v0.68.3` version comment untouched.
    #
    # Upgrade gh-aw by re-running its compiler and committing the regenerated
    # lock files, not by bumping the pin.
    ignore:
      - dependency-name: 'github/gh-aw-actions*'
